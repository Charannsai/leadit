name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Remove API keys and any real names, emails or company data** before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a CSV with …
        2. Press Enrich …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import / upload
        - Enrichment
        - Leads table / export
        - Outreach (email)
        - Outreach (LinkedIn tasks)
        - Agents / logs
        - Settings / API keys
        - Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Browser console errors, server output, or entries from Settings → Agents → Logs (with keys and personal data removed).
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Local / Vercel · Node 20 · Chrome 130 · commit abc123"
